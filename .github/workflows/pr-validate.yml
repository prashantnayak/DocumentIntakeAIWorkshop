name: PR Validate

# Validates every pull request that touches infrastructure, application, or
# pipeline code. All jobs except `what-if` require no Azure credentials at
# all (Bicep build, Python tests, JSON parsing, PowerShell analysis, and
# PSRule for Azure all run fully offline against the compiled templates).
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/**'
      - 'sql/**'
      - 'scripts/**'
      - 'tests/**'
      - 'bicepconfig.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bicep-build:
    name: Bicep build (strict lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bicep CLI
        run: az bicep install
      - name: az bicep build (infra/main.bicep)
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --outfile /dev/null
      - name: az bicep build-params (infra/params/dev.bicepparam)
        run: |
          set -euo pipefail
          az bicep build-params --file infra/params/dev.bicepparam --outfile /dev/null
      - name: Fail on ANY Bicep diagnostic (warnings included)
        run: |
          set -euo pipefail
          # bicepconfig.json sets every actionable linter rule to error and
          # switches off `use-recent-module-versions`, which cannot complete
          # its registry lookup during a CLI build and therefore emits
          # nondeterministic "versions have not yet been downloaded" noise on
          # every run. The avm-module-versions job below replaces that rule
          # with a deterministic check, which is why this gate can insist on
          # a completely silent build.
          out="$(az bicep build --file infra/main.bicep --stdout 2>&1 >/dev/null)"
          if [ -n "$out" ]; then
            echo "::error::Bicep build is not clean. Diagnostics:"
            echo "$out"
            exit 1
          fi
          out_params="$(az bicep build-params --file infra/params/dev.bicepparam --stdout 2>&1 >/dev/null)"
          if [ -n "$out_params" ]; then
            echo "::error::Bicep build-params is not clean. Diagnostics:"
            echo "$out_params"
            exit 1
          fi
          echo "Bicep build and build-params produced no errors and no warnings."

  avm-module-versions:
    name: Pinned AVM module versions exist in MCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify every pinned br/public:avm module version
        shell: pwsh
        run: ./scripts/verify-avm-module-versions.ps1

  python-test:
    name: Python Durable Functions tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/functions/requirements*.txt
      - name: Install Function test dependencies
        run: python -m pip install --disable-pip-version-check -r src/functions/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q src/functions tests/functions
      - name: Run unit tests
        run: python -m pytest -q tests/functions

  logicapps-json-validate:
    name: Logic Apps workflow JSON validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse every Logic Apps JSON file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path src/logicapps -Recurse -Filter *.json
          if ($files.Count -eq 0) { throw 'No Logic Apps JSON files found -- check the path filter.' }
          foreach ($f in $files) {
            Write-Host "Parsing $($f.FullName)"
            $null = Get-Content -Raw -Path $f.FullName | ConvertFrom-Json
          }
          Write-Host "All $($files.Count) Logic Apps JSON files parsed successfully."
      - name: Every workflow has a secure HTTP Request trigger
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @('business-rules-workflow', 'human-approval-workflow', 'sla-notification-workflow')
          foreach ($name in $expected) {
            $path = "src/logicapps/$name/workflow.json"
            if (-not (Test-Path $path)) { throw "Missing workflow definition: $path" }
            $definition = (Get-Content -Raw -Path $path | ConvertFrom-Json).definition
            if (-not $definition.triggers) { throw "$name has no trigger." }
            foreach ($trigger in $definition.triggers.PSObject.Properties) {
              if ($trigger.Value.type -ne 'Request' -or $trigger.Value.kind -ne 'Http') {
                throw "Trigger '$($trigger.Name)' in $name must be an HTTP Request trigger."
              }
              $secure = $trigger.Value.runtimeConfiguration.secureData.properties
              if (-not ($secure -contains 'inputs')) {
                throw "Trigger '$($trigger.Name)' in $name does not mark inputs as secure data; message data would land in run history."
              }
            }
          }
          Write-Host "All $($expected.Count) workflows present with secure HTTP Request-trigger inputs."
      - name: Reject legacy messaging contracts and parse ARM JSON modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $legacy = Get-ChildItem -Path infra, src, sql -Recurse -File |
            Select-String -Pattern 'ServiceBus|serviceBus|Microsoft\.ServiceBus|EventGrid|eventGrid|Microsoft\.EventGrid'
          if ($legacy) {
            $legacy | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Legacy messaging references remain in active infrastructure, application, or database contracts.'
          }
          Get-ChildItem -Path infra/modules -Filter *.json | ForEach-Object {
            Write-Host "Parsing $($_.FullName)"
            $null = Get-Content -Raw -Path $_.FullName | ConvertFrom-Json
          }

  powershell-analyze:
    name: PowerShell script analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Parse-check every script (AST) then lint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem -Path scripts, tests -Recurse -Filter *.ps1
          if ($scripts.Count -eq 0) { throw 'No PowerShell scripts found -- check the path filter.' }
          foreach ($s in $scripts) {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) {
              throw "$($s.FullName) failed to parse: $($parseErrors[0].Message)"
            }
          }
          # Invoke-ScriptAnalyzer -Path takes a SINGLE path (it is not an
          # array parameter), so pass the already-enumerated files instead of
          # a comma-separated list.
          $results = $scripts | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning, Error }
          $results | Format-Table -AutoSize | Out-String | Write-Host
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) { throw "PSScriptAnalyzer found $($errors.Count) error-level finding(s)." }

  psrule:
    name: PSRule for Azure (0 failures required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bicep CLI
        run: az bicep install
      - name: Install Pester and PSRule.Rules.Azure
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module -Name PSRule.Rules.Azure -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run the PSRule Pester wrapper (tests/ps-rule/ps-rule.tests.ps1)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/ps-rule/ps-rule.tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  what-if:
    name: What-If (dev) + PR comment
    # Requires Azure OIDC federation and environment secrets from
    # scripts/bootstrap.ps1 to be configured first (see README.md). Gated
    # behind a repository variable so a freshly cloned repo's PRs do not
    # fail CI before Azure access has been bootstrapped.
    if: vars.ENABLE_WHATIF_VALIDATION == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [bicep-build]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (OIDC, no client secret)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: az deployment sub what-if
        id: whatif
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Tenant-specific object IDs/emails/tags are intentionally left as
          # REPLACE-BEFORE-DEPLOY placeholders in infra/params/dev.bicepparam
          # (see docs/ASSUMPTIONS.md). Real values are layered on top here
          # from environment secrets so no tenant-specific identifiers are
          # ever committed to source control.
          . "$env:GITHUB_WORKSPACE/.github/workflows/scripts/build-extra-parameters.ps1"
          $extraArgs = Get-ExtraDeploymentParameters

          $baseArgs = @(
            'deployment', 'sub', 'what-if',
            '--location', 'swedencentral',
            '--template-file', 'infra/main.bicep',
            '--parameters', 'infra/params/dev.bicepparam',
            '--no-pretty-print'
          )
          $rawOutput = & az @baseArgs @extraArgs 2>&1
          $exitCode = $LASTEXITCODE
          $rawOutput | Out-File -FilePath whatif-raw.txt -Encoding utf8

          # Strip ANSI colour codes for a clean PR comment.
          $clean = ($rawOutput -join "`n") -replace "`e\[[0-9;]*m", ''
          if ($clean.Length -gt 60000) { $clean = $clean.Substring(0, 60000) + "`n... (truncated, see workflow run logs for full output)" }
          @"
          ### az deployment sub what-if -- dev (run #${env:GITHUB_RUN_NUMBER})

          <details><summary>Show what-if output</summary>

          ``````
          $clean
          ``````

          </details>
          "@ | Out-File -FilePath whatif-comment.md -Encoding utf8

          exit $exitCode
        env:
          ENTRA_GROUPS_JSON: ${{ secrets.AZURE_ENTRA_GROUPS_JSON }}
          ALERTING_JSON: ${{ secrets.AZURE_ALERTING_JSON }}
          TAGS_JSON: ${{ secrets.AZURE_TAGS_JSON }}
      - name: Post what-if result as a PR comment
        if: always()
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --body-file whatif-comment.md 2>/dev/null \
            || gh pr comment "$PR_NUMBER" --body-file whatif-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
